# No redis service here, deliberately — ADR-013 Option D holds all shared
# ephemeral state (JWT revocation, rate limiting) in MongoDB TTL
# collections instead. Don't "fix" this by adding one.
services:
  server:
    build: ./server
    # No secret is duplicated into this file — every value lives in
    # server/.env, which is gitignored (§A6.4, NFR-8).
    env_file: ./server/.env
    ports:
      - '5000:5000'
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: /api
        VITE_SOCKET_URL: ''
    ports:
      - '8080:80'
    depends_on:
      server:
        condition: service_healthy

